name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore TicketsPlease.slnx

    - name: Restore tools
      run: dotnet tool restore

    - name: Verify Formatting
      run: dotnet format TicketsPlease.slnx --verify-no-changes

    - name: Download Tailwind CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p src/TicketsPlease.Web/obj/tailwind-cli
        curl -L -H "Authorization: token $GITHUB_TOKEN" -o src/TicketsPlease.Web/obj/tailwind-cli/tailwindcss-linux-x64 https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.2/tailwindcss-linux-x64
        chmod +x src/TicketsPlease.Web/obj/tailwind-cli/tailwindcss-linux-x64

    - name: Build
      run: dotnet build TicketsPlease.slnx --no-restore --configuration Release -p:TailwindCliPath=$GITHUB_WORKSPACE/src/TicketsPlease.Web/obj/tailwind-cli/tailwindcss-linux-x64

    - name: Install Playwright Browsers
      run: |
        pwsh tests/TicketsPlease.E2ETests/bin/Release/net10.0/playwright.ps1 install
        pwsh tests/TicketsPlease.E2ETests/bin/Release/net10.0/playwright.ps1 install-deps

    - name: Test and collect coverage
      run: dotnet test TicketsPlease.slnx --no-build --configuration Release --verbosity minimal --collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add Coverage PR Comment
      uses: thollander/actions-comment-pull-request@v3
      if: github.event_name == 'pull_request'
      with:
        file-path: ./code-coverage-results.md
